<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="background">
                <div class="banner">
                    <img id="logo" src="images/logo.png">
                    <p class="odin">Odin</p>
                </div>
            </div>
            <div id = 'text_form'>
                <div id="expo_text">
                    <p>Hello world! this is a page for
                         a nonexistent website. Sign up below by adding your details and pressing the Create Account button.</p>
                    <p>You know you can do it!</p>
                    <p>Let's do this!</p>
                </div>
            <form>
                
                <fieldset class="form_inputs">
                    <div class="column_1">
                        <div class="details">
                            <label for="first_name">first name: </label>
                            <input class="input" id="first_name" name="first_name" type="text">
                        </div>
                        <div class="details">
                            <label for="last_name">last name: </label>
                            <input class="input" id="last_name" name="last_name" type="text">
                        </div>
                        <div class="details">
                            <label for="email">email: </label>
                            <input class="input" id="email" name="email" type="email">
                        </div>
                    </div>
                    <div class="column_2">
                        <div class="details">
                            <label for="phone_number">phone number: </label>
                            <input class="input" id="phone_number" name="phone_number" type="text" minlength="10" maxlength="10" pattern="^[0-9]+$">
                        </div>
                        <div class="details">
                            <label for="password">password: </label>
                            <input class="input" id="password" name="password" type="password">
                        </div>
                        <div class="details">
                            <label for="confirm_password">confirm password: </label>
                            <input class="input" id="confirm_password" name="confirm_password" type="password">
                        </div>
                    </div>
                </fieldset>

                <button type="submit">create account</button>

            </form>
            <p>Already have an account? <a>Log in.</a></p>
            </div>
        </div>
    </body>
</html>
